<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>Pluvia</title>

<style>
:root{
  --ink: oklch(0.96 0.01 240);
  --ink-dim: oklch(0.80 0.02 240);
  --ink-faint: oklch(0.66 0.02 240);
  --paper: oklch(0.955 0.014 145);
  --paper-2: oklch(0.915 0.02 145);
  --moss: oklch(0.42 0.07 150);
  --moss-deep: oklch(0.28 0.05 155);
  --soil: oklch(0.33 0.03 60);
  --water: oklch(0.62 0.09 235);
  --ease-out: cubic-bezier(0.16,1,0.3,1);
  --ease-in: cubic-bezier(0.7,0,0.84,0);
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:oklch(0.16 0.015 255);color:var(--ink);font-family:var(--sans);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#c:active{cursor:grabbing}
.layer{position:fixed;inset:0;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid oklch(0.85 0.08 235);outline-offset:3px;border-radius:6px}

/* HUD */
#hud{opacity:0;transition:opacity .6s var(--ease-out)}
#hud.on{opacity:1}
#chapterTag{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));
  font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);text-shadow:0 1px 8px oklch(0.1 0.02 250 / .6)}
#chapterTag b{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0;text-transform:none;font-size:1.05rem;color:var(--ink);margin-left:.4em}
.corner{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:2px;pointer-events:auto}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink-dim);transition:color .2s,transform .15s var(--ease-out)}
.icon-btn:hover{color:var(--ink)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 4px oklch(0.1 0.02 250 / .5))}

/* Chapter card */
#card{position:absolute;left:0;right:0;top:30%;text-align:center;opacity:0;transform:translateY(8px);transition:opacity 1.1s var(--ease-out),transform 1.4s var(--ease-out)}
#card.on{opacity:1;transform:none}
#card .num{font-size:.72rem;letter-spacing:.3em;color:var(--ink-dim)}
#card h2{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.05;margin:.2em 0 .25em;text-shadow:0 2px 24px oklch(0.12 0.03 250 / .55)}
#card p{font-family:var(--serif);font-style:italic;font-size:1.1rem;color:var(--ink-dim)}

/* Title */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12vh;transition:opacity 1s var(--ease-out)}
#title.off{opacity:0}
#title h1{font-family:var(--serif);font-weight:400;font-size:clamp(3.4rem,13vw,6.5rem);letter-spacing:-.01em;line-height:1;text-shadow:0 4px 40px oklch(0.15 0.04 260 / .6)}
#title .tag{font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--ink-dim);margin-top:.5rem}
#title .how{position:absolute;bottom:max(14vh,90px);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);display:flex;flex-direction:column;align-items:center;gap:14px}
#title .how i{display:block;width:1px;height:38px;background:linear-gradient(oklch(0.95 0.01 240 / 0),oklch(0.95 0.01 240 / .8));animation:pull 2.2s var(--ease-out) infinite}
@keyframes pull{0%{transform:translateY(-10px) scaleY(.4);opacity:0}40%{opacity:1}100%{transform:translateY(14px) scaleY(1);opacity:0}}
#title .foot{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));display:flex;gap:28px;pointer-events:auto}
.text-btn{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);padding:12px 6px;transition:color .2s}
.text-btn:hover{color:var(--ink)}

/* toast */
#toast{position:absolute;left:50%;bottom:max(34px,env(safe-area-inset-bottom));transform:translate(-50%,10px);opacity:0;
  text-align:center;transition:opacity .5s var(--ease-out),transform .7s var(--ease-out);max-width:min(88vw,420px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast small{display:block;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:oklch(0.86 0.09 85)}
#toast span{font-family:var(--serif);font-size:1.35rem;text-shadow:0 2px 16px oklch(0.1 0.02 250 / .7)}
#toast em{display:block;font-family:var(--serif);font-size:1rem;color:var(--ink-dim)}

/* hint (non-moment) */
#hint{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-family:var(--serif);font-style:italic;font-size:1.2rem;
  color:var(--ink);text-align:center;opacity:0;transition:opacity .6s var(--ease-out);max-width:min(86vw,380px);text-shadow:0 2px 14px oklch(0.1 0.02 250 / .8)}
#hint.on{opacity:1}

/* Panels */
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s var(--ease-out)}
.panel.on{opacity:1;pointer-events:auto}

#pause{background:oklch(0.14 0.02 255 / .72)}
#pause .inner{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
#pause h3{font-family:var(--serif);font-weight:400;font-size:2.6rem;margin-bottom:18px}
#pause .keys{margin-top:26px;font-size:.8rem;color:var(--ink-faint);line-height:1.9}
#pause kbd{font-family:var(--sans);font-size:.72rem;padding:1px 6px;border:1px solid oklch(0.6 0.02 240);border-radius:4px;color:var(--ink-dim)}
.big-btn{font-family:var(--serif);font-size:1.5rem;padding:8px 18px;color:var(--ink);transition:color .2s,transform .15s}
.big-btn:hover{color:oklch(0.88 0.08 230)}
.big-btn:active{transform:scale(.97)}

/* Plant panel: light, daylight, paper */
#plant{background:var(--paper);color:var(--moss-deep);overflow:auto;align-items:stretch}
#plant .wrap{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,440px);gap:clamp(24px,5vw,72px);width:min(1080px,100%);margin:auto;padding:clamp(24px,5vh,64px) clamp(20px,5vw,56px)}
#plantCanvas{width:100%;aspect-ratio:4/5;max-height:78vh;display:block}
#plant .eyebrow{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:oklch(0.5 0.05 150)}
#plant h3{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,5vw,3.2rem);line-height:1.02;margin:.25em 0 .2em;color:oklch(0.25 0.04 155);text-wrap:balance}
#plant .lede{font-family:var(--serif);font-style:italic;font-size:1.2rem;color:oklch(0.42 0.04 150);max-width:36ch}
#plant .ml{font-variant-numeric:tabular-nums;font-family:var(--serif);font-size:1.25rem;color:oklch(0.35 0.06 230);margin-top:18px}
#plant .ml b{font-weight:400;font-size:2.2rem}
#plant h4{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:oklch(0.5 0.05 150);margin:34px 0 12px;font-weight:600}
.ladder{list-style:none;display:flex;flex-direction:column}
.ladder li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:7px 0;align-items:start;color:oklch(0.62 0.02 150)}
.ladder li .dot{width:11px;height:11px;border-radius:50%;border:1.5px solid oklch(0.7 0.03 150);margin:6px 0 0 5px}
.ladder li.got{color:oklch(0.3 0.05 155)}
.ladder li.got .dot{background:var(--moss);border-color:var(--moss)}
.ladder li b{font-weight:600;font-size:.92rem}
.ladder li span{display:block;font-size:.85rem;opacity:.85}
.ladder li small{font-size:.72rem;letter-spacing:.06em;font-variant-numeric:tabular-nums;opacity:.8}
.moments{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 18px}
.moments div{padding:6px 0;font-size:.86rem;color:oklch(0.66 0.02 150);line-height:1.3}
.moments div.got{color:oklch(0.3 0.05 155)}
.moments div b{display:block;font-family:var(--serif);font-weight:400;font-size:1.08rem}
.moments div.got b::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:oklch(0.7 0.12 75);margin:0 7px 3px 0}
#plant .actions{display:flex;gap:10px;margin-top:34px;flex-wrap:wrap}
.pill{font-size:.9rem;font-weight:600;padding:13px 26px;border-radius:999px;background:var(--moss-deep);color:var(--paper);transition:transform .15s var(--ease-out),background .2s}
.pill:hover{background:oklch(0.34 0.06 155)}
.pill:active{transform:scale(.97)}
.pill.ghost{background:none;color:var(--moss-deep);box-shadow:inset 0 0 0 1.5px oklch(0.7 0.04 150)}
.pill.ghost:hover{background:var(--paper-2)}
@media (max-width:760px){
  #plant .wrap{grid-template-columns:1fr;gap:8px}
  #plantCanvas{max-height:46vh;aspect-ratio:1/1}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition-duration:.01s!important} }
</style>

<body>
<canvas id="c"></canvas>

<div class="layer" id="hud">
  <div id="chapterTag"><span id="tagNum">I</span><b id="tagName">The Window</b></div>
  <div class="corner">
    <button class="icon-btn" id="btnSound" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path class="w1" d="M15.5 9a4 4 0 0 1 0 6"></path><path class="w2" d="M18 6.5a7.5 7.5 0 0 1 0 11"></path></svg></button>
    <button class="icon-btn" id="btnPause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"></path></svg></button>
  </div>
  <div id="card"><div class="num" id="cardNum">I</div><h2 id="cardName">The Window</h2><p id="cardLine"></p></div>
  <div id="hint"></div>
  <div id="toast"><small id="toastKicker">Moment</small><span id="toastText"></span><em id="toastSub"></em></div>
</div>

<div class="layer" id="title">
  <h1>Pluvia</h1>
  <div class="tag">the long way down</div>
  <div class="how"><span id="howText">pull the leaf down</span><i></i></div>
  <div class="foot">
    <button class="text-btn" id="btnPlant">Your plant</button>
    <button class="text-btn" id="btnSound2">Sound on</button>
  </div>
</div>

<div class="panel" id="pause" inert="">
  <div class="inner">
    <h3>Held still</h3>
    <button class="big-btn" id="btnResume">Resume</button>
    <button class="big-btn" id="btnRestart">Fall again from the leaf</button>
    <div class="keys"><kbd>←</kbd> <kbd>→</kbd> or drag to lean &nbsp;·&nbsp; <kbd>space</kbd> or double-tap to split<br><kbd>esc</kbd> pause &nbsp;·&nbsp; <kbd>m</kbd> sound</div>
  </div>
</div>

<div class="panel" id="plant" inert="">
  <div class="wrap">
    <canvas id="plantCanvas" width="800" height="1000" aria-label="Your plant"></canvas>
    <div>
      <div class="eyebrow" id="plantEyebrow">Your plant</div>
      <h3 id="plantTitle">A seed's promise</h3>
      <p class="lede" id="plantLede">Every drop that reaches the soil stays here.</p>
      <div class="ml"><b id="plantMl">0.00</b> ml returned</div>
      <h4>What it gives back</h4>
      <ul class="ladder" id="ladder"></ul>
      <h4>Moments</h4>
      <div class="moments" id="moments"></div>
      <div class="actions">
        <button class="pill" id="btnAgain">Fall again</button>
        <button class="pill ghost" id="btnClose">Back to the leaf</button>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
/* ============================================================
   PLUVIA: the long way down
   One droplet. Four surfaces. Back to the soil.
   ============================================================ */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const smooth = t => t * t * (3 - 2 * t);
const easeOut = t => 1 - Math.pow(1 - t, 4);
function hash(n) { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); }
function noise1(x) { const i = Math.floor(x), f = x - i; return lerp(hash(i), hash(i + 1), smooth(f)) * 2 - 1; }
function poisson(l) { let L = Math.exp(-l), k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L && k < 40); return k - 1; }
const massR = m => 9 * Math.sqrt(Math.max(m, 0.0001));
const ML = 0.05; // 1 unit of mass = 0.05 ml
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- save ---------------- */
const SAVE_KEY = 'pluvia.save.v1';
const save = Object.assign({ bank: 0, flowers: [], moments: {}, introSeen: false, journeys: 0, runs: 0, sound: true, hints: {} },
  (() => { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); } catch (e) { return {}; } })());
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { } }

const STAGES = [
  { at: 0, name: "A seed's promise" },
  { at: 6, name: 'Sprout', perk: 'Deeper roots', desc: 'Begin each journey 15% heavier.' },
  { at: 16, name: 'First leaves', perk: 'Shade', desc: 'Evaporation slowed by 15%.' },
  { at: 32, name: 'Reaching', perk: 'Glassy skin', desc: 'Special drops last 30% longer.' },
  { at: 56, name: 'Canopy', perk: 'Kinship', desc: 'A split twin drifts back toward you.' },
  { at: 90, name: 'In bloom', perk: 'Welcome', desc: 'More droplets gather at every sill.' },
];
function stageOf(b) { let s = 0; STAGES.forEach((st, i) => { if (b >= st.at) s = i; }); return s; }
const perk = i => stageOf(save.bank) >= i;

const MOMENTS = [
  { id: 'first', name: 'First Fall', desc: 'Let go of the leaf.' },
  { id: 'circle', name: 'Full Circle', desc: 'Return water to your plant.' },
  { id: 'storm', name: 'Heavy as a Storm', desc: 'Swell past 3.5 drops of mass.' },
  { id: 'shave', name: 'Close Shave', desc: 'Let a wiper pass within a hair.' },
  { id: 'unbroken', name: 'Unbroken', desc: 'Reach the soil without splitting.' },
  { id: 'thaw', name: 'Thaw', desc: 'Crack free of the frost.' },
  { id: 'pollinator', name: 'Pollinator', desc: 'Carry all four pollen home at once.' },
  { id: 'thread', name: 'By a Thread', desc: 'Leave a pane lighter than half a drop.' },
  { id: 'reunion', name: 'Reunion', desc: 'Find your split twin again.' },
];

/* ---------------- audio (all synthesized) ---------------- */
const A = { ctx: null, on: save.sound !== false };
function audioInit() {
  if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const C = new AC(); A.ctx = C;
  const comp = C.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3; comp.connect(C.destination);
  A.master = C.createGain(); A.master.gain.value = A.on ? 0.9 : 0; A.master.connect(comp);
  // pink-ish noise buffer
  const len = C.sampleRate * 3, buf = C.createBuffer(1, len, C.sampleRate), d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; b0 = .997 * b0 + w * .029; b1 = .985 * b1 + w * .032; b2 = .95 * b2 + w * .048; d[i] = (b0 + b1 + b2 + w * .02) * 1.6; }
  A.noise = buf;
  const wbuf = C.createBuffer(1, C.sampleRate, C.sampleRate), wd = wbuf.getChannelData(0);
  for (let i = 0; i < wd.length; i++) wd[i] = Math.random() * 2 - 1; A.white = wbuf;
  const loop = (b) => { const s = C.createBufferSource(); s.buffer = b; s.loop = true; s.start(); return s; };
  const chain = (src, nodes, g0) => { let n = src; nodes.forEach(x => { n.connect(x); n = x; }); const g = C.createGain(); g.gain.value = g0; n.connect(g); g.connect(A.master); return g; };
  const bq = (type, f, q) => { const b = C.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q) b.Q.value = q; return b; };
  A.rain = chain(loop(buf), [bq('highpass', 700), bq('lowpass', 5200)], 0);
  A.rainLow = chain(loop(buf), [bq('lowpass', 380)], 0);
  const wbp = bq('bandpass', 420, .9); A.windF = wbp.frequency;
  A.wind = chain(loop(buf), [wbp], 0);
  const sbp = bq('bandpass', 2100, 1.4); A.slideF = sbp.frequency;
  A.slide = chain(loop(A.white), [sbp], 0);
  // engine
  const eo = C.createOscillator(); eo.type = 'sawtooth'; eo.frequency.value = 42; eo.start(); A.engF = eo.frequency;
  A.engine = chain(eo, [bq('lowpass', 150)], 0);
  // pad
  A.padG = C.createGain(); A.padG.gain.value = 0; const pf = bq('lowpass', 900); A.padG.connect(pf); pf.connect(A.master);
  A.pad = [0, 1, 2, 3].map(i => { const o = C.createOscillator(); o.type = 'triangle'; o.frequency.value = 220; o.detune.value = (i % 2 ? 6 : -6); const g = C.createGain(); g.gain.value = .22; o.connect(g); g.connect(A.padG); o.start(); return o; });
  setPad(CHORDS[0]);
}
const CHORDS = [[110, 164.8, 246.9, 329.6], [87.3, 130.8, 220, 329.6], [82.4, 123.5, 246.9, 370], [65.4, 98, 196, 293.7]];
function setPad(ch) { if (!A.ctx) return; const t = A.ctx.currentTime; A.pad.forEach((o, i) => o.frequency.setTargetAtTime(ch[i], t, 1.5)); }
function setSound(on) {
  A.on = on; save.sound = on; persist();
  if (A.master) A.master.gain.setTargetAtTime(on ? 0.9 : 0, A.ctx.currentTime, .1);
  document.querySelectorAll('#btnSound .w1,#btnSound .w2').forEach(p => p.style.opacity = on ? 1 : 0);
  $('#btnSound2').textContent = on ? 'Sound on' : 'Sound off';
}
function aset(g, v, tc = .15) { if (A.ctx && g) g.gain.setTargetAtTime(v, A.ctx.currentTime, tc); }
function panner(p) { const C = A.ctx; if (C.createStereoPanner) { const s = C.createStereoPanner(); s.pan.value = clamp(p, -1, 1); s.connect(A.master); return s; } return A.master; }
function plip(freq, vol = .18, pan = 0, dur = .12) {
  if (!A.ctx || !A.on) return; const C = A.ctx, t = C.currentTime;
  const o = C.createOscillator(), g = C.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * .52, t + dur * .8);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + dur + .06);
  o.connect(g); g.connect(panner(pan)); o.start(t); o.stop(t + dur + .1);
}
function noiseHit(f, q, vol, dur, pan = 0, type = 'bandpass') {
  if (!A.ctx || !A.on) return; const C = A.ctx, t = C.currentTime;
  const s = C.createBufferSource(); s.buffer = A.white; const b = C.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q;
  const g = C.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(b); b.connect(g); g.connect(panner(pan)); s.start(t, Math.random() * .5); s.stop(t + dur + .05);
}
const sfx = {
  absorb(dm, pan) { plip(clamp(1300 - dm * 1400, 380, 1300) * rand(.94, 1.06), clamp(.08 + dm * .5, .08, .3), pan); },
  tick(pan) { noiseHit(rand(3500, 7000), 3, rand(.015, .05), .04, pan); },
  split() { plip(620, .2, -.3, .1); setTimeout(() => plip(980, .16, .3, .09), 45); },
  land() { plip(210, .35, 0, .3); noiseHit(900, .7, .14, .25); },
  chime(n = 0) { [880, 1108.7, 1318.5, 1760].forEach((f, i) => setTimeout(() => plip(f * (n ? 1.122 : 1), .1, (i - 1.5) * .3, .9), i * 110)); },
  wiperTick() { noiseHit(2500, 8, .06, .025); plip(1400, .03, 0, .02); },
  wiper() {
    if (!A.ctx || !A.on) return; const C = A.ctx, t = C.currentTime;
    const s = C.createBufferSource(); s.buffer = A.noise; const b = C.createBiquadFilter(); b.type = 'bandpass'; b.Q.value = 1.2;

/* ---------------- fall between surfaces ---------------- */
function renderFall() {
  const f = world.fall, u = clamp(f.t / f.dur, 0, 1);

  drawSceneInto(sctx, f.from, world.cam, 1); drawSceneInto(sctx, f.to, 0, smooth(u)); sctx.globalAlpha = 1;
  lctx.drawImage(scene, 0, 0, sceneLo.width, sceneLo.height);

  ctx.drawImage(scene, 0, 0, W, VH);

  ctx.strokeStyle = 'rgba(225,232,255,.22)'; ctx.lineWidth = 1;

    const y = ((hash(i + 7) * VH - f.t * sp) % (VH + 100) + VH + 100) % (VH + 100) - 50; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + len * Math.sin(u * Math.PI)); ctx.stroke(); }

}
function drawPlayerPollen(x, y) { P.pollen.forEach((ci, i) => { const a = sceneT + i * 2; ctx.fillStyle = POLLEN_COLORS[ci]; ctx.beginPath(); ctx.arc(x + Math.cos(a) * P.r * .4, y + Math.sin(a) * P.r * .3, 1.8, 0, TAU); ctx.fill(); }); }

/* ---------------- ending: into the soil ---------------- */
function renderEnding() {
  const t = world.et;

  const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, 'oklch(0.36 0.04 65)'); g.addColorStop(1, 'oklch(0.22 0.03 55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, VH);
  for (let i = 0; i < 260; i++) { ctx.fillStyle = `rgba(${hash(i) > .7 ? '200,180,140' : '20,14,8'},${.15 + hash(i + 1) * .35})`; ctx.fillRect(hash(i + 2) * W, hash(i + 3) * VH, 1 + hash(i + 4) * 2.5, 1 + hash(i + 5) * 2); }
  ctx.strokeStyle = 'rgba(235,220,190,.22)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.moveTo(W * .5 + (hash(i) - .5) * 60, VH * .58); ctx.bezierCurveTo(W * hash(i + 1), VH * .7, W * hash(i + 2), VH * .85, W * hash(i + 3), VH + 20); ctx.stroke(); }
  const land = VH * .56, tFall = .75;
  const x = world.endX != null ? lerp(world.endX, W * .5, clamp(t / tFall, 0, 1)) : W * .5;
  if (t < tFall) { const u = t / tFall; drawDrop({ x, r: P.r, m: P.m, wob: P.wob, st: .6, dirx: 0, diry: 1, type: 'w' }, false, lerp(-30, land, u * u)); if (P.pollen.length) drawPlayerPollen(x, lerp(-30, land, u * u)); }
  else {

    ctx.fillStyle = `rgba(20,12,6,${.55 * (1 - u * .3)})`; ctx.beginPath(); ctx.ellipse(W * .5, land, 12 + easeOut(u) * P.r * 6, (12 + easeOut(u) * P.r * 6) * .45, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(210,225,255,${(1 - u) * .5})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(W * .5, land, easeOut(u) * 90, easeOut(u) * 36, 0, 0, TAU); ctx.stroke();
    const pr = P.r * (1 - u); if (pr > .5) drawDrop({ x: W * .5, r: pr, m: P.m, wob: P.wob, st: 0, dirx: 0, diry: 1, type: 'w' }, false, land - pr * .5);

/* ---------------- the plant ---------------- */
const pc = $('#plantCanvas'), pctx = pc.getContext('2d');
let plantAnim = null;
const growthOf = b => clamp(Math.sqrt(b / 120), 0, 1);
function drawPlant(g, t, ripple) {
  const x = pctx, Wp = 800, Hp = 1000; x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, Wp, Hp);
  // window light falling across the table
  const lg = x.createLinearGradient(0, 0, Wp, Hp); lg.addColorStop(0, 'rgba(255,252,235,.9)'); lg.addColorStop(1, 'rgba(255,252,235,0)');
  x.fillStyle = lg; x.beginPath(); x.moveTo(90, 0); x.lineTo(560, 0); x.lineTo(760, 1000); x.lineTo(160, 1000); x.fill();
  x.fillStyle = 'oklch(0.88 0.02 120)'; x.fillRect(0, 960, Wp, 40);

    return [a * a * baseX + 2 * a * s * cx + s * s * ex, a * a * baseY + 2 * a * s * cy + s * s * ey]; };

    const s = .12 + (i / Math.max(1, n - 1)) * .84, [px, py] = stem(Math.min(s, .98)), side = i % 2 ? 1 : -1;
    const grow = clamp(g * 13 - i, 0, 1), L = (60 + g * 150) * (1 - s * .45) * (.35 + .65 * grow);
    const ang = side * (1.05 - s * .5) + Math.sin(t * 1.1 + i) * .04;
    x.save(); x.translate(px, py); x.rotate(ang); x.scale(side, 1);
    const lg2 = x.createLinearGradient(0, 0, L, 0); lg2.addColorStop(0, 'oklch(0.5 0.11 142)'); lg2.addColorStop(1, 'oklch(0.62 0.13 132)');
    x.fillStyle = lg2; x.beginPath(); x.moveTo(0, 0); x.bezierCurveTo(L * .3, -L * .38, L * .75, -L * .3, L, L * .05); x.bezierCurveTo(L * .7, L * .22, L * .3, L * .2, 0, 0); x.fill();
    x.strokeStyle = 'oklch(0.72 0.1 130 / .7)'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(L * .5, -L * .05, L, L * .05); x.stroke();
    x.restore();
    if (i === 0) { const c = Math.cos(ang), sn = Math.sin(ang); lowTip = [px + side * L * c - L * .05 * sn * side * 0, py + L * sn * side + L * .05]; }

    x.fillStyle = `rgba(20,14,10,${(1 - ripple) * .5})`; x.beginPath(); x.ellipse(400, 808, 30 + ripple * 90, 6 + ripple * 14, 0, 0, TAU); x.fill(); }
  x.fillStyle = pg; x.beginPath(); x.moveTo(242, 812); x.lineTo(558, 812); x.lineTo(528, 960); x.lineTo(272, 960); x.closePath(); x.fill();

  x.fillStyle = 'rgba(255,240,220,.25)'; x.fillRect(236, 790, 328, 5);
}
function plantLoop(now) {

  drawPlant(g, plantAnim.t, plantAnim.ripple ? clamp(plantAnim.t / 1.6, 0, 1) : 0);

function openPlant(kind, fromBank) {
  fromBank = fromBank ?? save.bank;

  $('#hud').classList.remove('on'); $('#title').classList.add('off');
  const stg = STAGES[stageOf(save.bank)], reached = CH[run ? run.reached : 0];
  if (kind === 'ending') {
    $('#plantEyebrow').textContent = 'Journey complete';
    $('#plantTitle').textContent = 'Returned to the soil.';
    const pol = P.pollen.length;
    $('#plantLede').textContent = `${(run.delivered * ML).toFixed(3)} ml soaked into the roots${pol ? `, and ${pol === 1 ? 'the pollen' : pol + ' grains of pollen'} took root.` : '.'} Your plant is now: ${stg.name.toLowerCase()}.`;
    $('#btnAgain').textContent = 'Fall again';
  } else if (kind === 'vapor') {
    $('#plantEyebrow').textContent = `Evaporated · ${reached.name}`;
    $('#plantTitle').textContent = 'Rose as vapor.';
    $('#plantLede').textContent = run.banked > 0 ? `It will fall again somewhere. ${(run.banked * ML).toFixed(3)} ml stayed behind on the sills and found its way down.` : 'It will fall again somewhere. Nothing reached the soil this time.';
    $('#btnAgain').textContent = 'Fall again';
  } else {
    $('#plantEyebrow').textContent = `Your plant · ${save.journeys} ${save.journeys === 1 ? 'journey' : 'journeys'} home`;
    $('#plantTitle').textContent = stg.name;
    $('#plantLede').textContent = 'Every drop that reaches the soil stays here. It grows, and it gives back.';
    $('#btnAgain').textContent = 'Fall';

  $('#moments').innerHTML = MOMENTS.map(m => `<div class="${save.moments[m.id] ? 'got' : ''}"><b>${m.name}</b>${m.desc}</div>`).join('');

function closePlant() { const p = $('#plant'); p.classList.remove('on'); p.inert = true; plantAnim = null; }
function plantOpen() { return $('#plant').classList.contains('on'); }

/* ---------------- pause ---------------- */
function togglePause(force) {
  if (!world || !(world.state === 'play' || world.state === 'gather')) return;
  world.paused = force != null ? force : !world.paused;
  const p = $('#pause'); p.classList.toggle('on', world.paused); p.inert = !world.paused;
  if (A.ctx) world.paused ? A.ctx.suspend() : A.ctx.resume();
  if (world.paused) setTimeout(() => $('#btnResume').focus({ preventScroll: true }), 30);
}

/* ---------------- input ---------------- */
cv.addEventListener('pointerdown', e => {
  audioInit(); if (plantOpen() || world.paused) return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  ptr.id = e.pointerId; ptr.x0 = ptr.x = e.clientX; ptr.y0 = ptr.y = e.clientY; ptr.t = performance.now(); ptr.steer = 0; ptr.moved = 0;
});

  const R = 40; let dx = ptr.x - ptr.x0;
  if (dx > R) { ptr.x0 = ptr.x - R; dx = R; } if (dx < -R) { ptr.x0 = ptr.x + R; dx = -R; }

function ptrEnd(e) {

    if (!world.intro.detached) introPull.target = 0; else world.introPullAt = world.introPullAt ?? world.intro.pull;

cv.addEventListener('pointerup', ptrEnd); cv.addEventListener('pointercancel', ptrEnd);
addEventListener('keydown', e => {

  switch (e.code) {
    case 'ArrowLeft': case 'KeyA': keys.left = true; break;
    case 'ArrowRight': case 'KeyD': keys.right = true; break;
    case 'Space': e.preventDefault(); if (e.repeat) break;
      if (intro) { if (save.introSeen) { world.introPullAt = world.intro.pull; detach(); } else introPull.target = 1.08; }

    case 'ArrowDown': case 'KeyS': if (intro) introPull.target = 1.08; break;
    case 'Enter': if (intro && save.introSeen) { world.introPullAt = world.intro.pull; detach(); } break;

});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if ((e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'KeyS') && world.state === 'intro' && !world.intro.detached) introPull.target = 0;
});
addEventListener('blur', () => { keys.left = keys.right = false; });

addEventListener('resize', resize);
$('#btnSound').onclick = () => { audioInit(); setSound(!A.on); };
$('#btnSound2').onclick = () => { audioInit(); setSound(!A.on); };
$('#btnPause').onclick = () => togglePause();
$('#btnResume').onclick = () => togglePause(false);
$('#btnRestart').onclick = () => { togglePause(false); toIntro(); };
$('#btnPlant').onclick = () => { audioInit(); openPlant('view'); };

/* ---------------- loop ---------------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - lastT) / 1000); lastT = now;
  try { if (!world.paused) update(dt); render(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
resize(); toIntro(); setSound(A.on);
if (document.fonts && document.fonts.load) document.fonts.load('500 40px Caveat').catch(() => { });
requestAnimationFrame(frame);
window.__pluvia = { get world() { return world; }, get P() { return P; }, save, jump(i) { if (world.state === 'intro') startPlay(); enterChapter(i, W / 2, P.m); world.state = 'play'; } };
